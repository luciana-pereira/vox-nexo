[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxnexo"
version = "1.0.0"
description = "VoxNexo: desktop audio translator local para Windows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argostranslate>=1.11,<2",
    "av>=15,<16",
    "faster-whisper>=1.1.1,<2",
    "numpy>=2.2,<3",
    "python-docx>=1.2,<2",
    "soundcard>=0.4.6,<0.5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.22,<7"]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
voxnexo = "tradutor_ao_vivo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradutor_ao_vivo = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
